<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>В ритме дыхания — Breathe Rhythm Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300&family=Source+Code+Pro&display=swap"
          rel="stylesheet"
          media="print"
          onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="./images/favicon.svg"/>
    <meta name="description"
          content="Нативный декларативный графический движок для визуализации поэтических перформансов в реальном времени.">
    <meta name="keywords" content="поэзия, инсталляция, цифровой арт, canvas, web components, typescript">
    <meta name="author" content="Оксана Кудакаева">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://okudakaeva.github.io/breathe-rhythm/">
    <meta property="og:title" content="В ритме дыхания — 🎙️🌊✨Breathe Rhythm — Поэтическая инсталляция">
    <meta property="og:description"
          content="Слова сгорают как холсты... Интерактивный Canvas-движок визуализации живой поэзии 🎙️🌊✨Breathe Rhythm">
    <meta property="og:image" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.jpg">
    <meta property="og:image:secure_url" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.jpg"/>
    <meta property="og:image:type" content="image/jpeg"/>
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Breathe Rhythm">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://okudakaeva.github.io/breathe-rhythm/">
    <meta name="twitter:title" content="В ритме дыхания — 🎙️🌊✨Breathe Rhythm — Поэтическая инсталляция">
    <meta name="twitter:description"
          content="Слова сгорают как холсты... Интерактивный Canvas-движок визуализации живой поэзии 🎙️🌊✨Breathe Rhythm">
    <meta name="twitter:image" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.jpg">
    <meta name="theme-color" content="#0b0b0b">
    <script src="./breathe_rhythm_engine.js" type="module"></script>
    <script src="./ui/index.js" type="module"></script>
</head>
<body>
<ui-app>
    <breathe-rhythm data-id="ID_ENGINE" visible></breathe-rhythm>

    <ui-overlay data-id="ID_PAUSE_OVERLAY" delay="350" hidden>
        <h2 class="screen-title" data-text="PAUSE_TITLE"></h2>
        <p class="screen-subtitle" data-text="APP_SUBTITLE"></p>
        <ui-play>
            <ui-button data-id="ID_BTN_RESUME" class="btn-play-large" data-text="BTN_RESUME">
                <ui-icon name="play" slot="icon"></ui-icon>
            </ui-button>
        </ui-play>
    </ui-overlay>

    <ui-toolbar data-id="ID_TOOLBAR" hidden>
        <ui-button data-id="ID_BTN_START" data-text="BTN_START">
            <ui-icon name="play" slot="icon"></ui-icon>
        </ui-button>
        <ui-button data-id="ID_BTN_RESET" data-text="BTN_RESET">
            <ui-icon name="reset" slot="icon"></ui-icon>
        </ui-button>
    </ui-toolbar>

    <ui-overlay data-id="ID_START_OVERLAY" delay="0">
        <ui-logo data-text="APP_TITLE"></ui-logo>
        <ui-subtitle data-text="APP_SUBTITLE"></ui-subtitle>
        <ui-play>
            <ui-button data-id="ID_BTN_INTRO" class="btn-play-large" data-text="BTN_START">
                <ui-icon name="play" slot="icon"></ui-icon>
            </ui-button>
        </ui-play>
        <ui-keyhints></ui-keyhints>
    </ui-overlay>
</ui-app>
</body>
</html>
