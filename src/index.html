<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>В ритме дыхания — Breathe Rhythm Engine</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='-10' y='35' font-size='50'>✨</text><text x='10' y='75' font-size='70'>🎙️</text><text x='0' y='95' font-size='70'>🌊</text><text x='60' y='45' font-size='50'>✨</text></svg>"/>
    <meta name="description"
          content="Нативный декларативный графический движок для визуализации поэтических перформансов в реальном времени.">
    <meta name="keywords" content="поэзия, инсталляция, цифровой арт, canvas, web components, typescript">
    <meta name="author" content="Оксана Кудакаева">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://okudakaeva.github.io/breathe-rhythm/">
    <meta property="og:title" content="В ритме дыхания — 🎙️🌊✨Breathe Rhythm — Поэтическая инсталляция">
    <meta property="og:description"
          content="Слова сгорают как холсты... Интерактивный Canvas-движок визуализации живой поэзии 🎙️🌊✨Breathe Rhythm">
    <meta property="og:image" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Breathe Rhythm">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://okudakaeva.github.io/breathe-rhythm/">
    <meta name="twitter:title" content="В ритме дыхания — 🎙️🌊✨Breathe Rhythm — Поэтическая инсталляция">
    <meta name="twitter:description" content="Слова сгорают как холсты... Интерактивный Canvas-движок визуализации живой поэзии 🎙️🌊✨Breathe Rhythm">
    <meta name="twitter:image" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.png">
    <meta name="theme-color" content="#0b0b0b">
    <script src="./ui/ui_overlay.js" type="module"></script>
    <script src="./ui/ui_toolbar.js" type="module"></script>
    <script src="./ui/ui_button.js" type="module"></script>
    <script src="./ui/ui_icon.js" type="module"></script>
    <script src="./breathe_rhythm_engine.js" type="module"></script>
    <script src="./main.js" type="module"></script>
</head>
<body>

<breathe-rhythm id="engine"></breathe-rhythm>

<ui-overlay id="pauseOverlay" delay="350" changeevent="engine-state-change">
    <h2 class="pause-title">...ПАУЗА...</h2>
    <ui-button id="btnResume" class="btn-play-large" changeevent="engine-state-change" label="Продолжить">
        <ui-icon name="play" slot="icon"></ui-icon>
    </ui-button>
</ui-overlay>

<ui-toolbar id="controls" changeevent="engine-state-change">
    <ui-button id="btnStart" changeevent="engine-state-change" label="Старт">
        <ui-icon name="play" slot="icon"></ui-icon>
    </ui-button>
    <ui-button id="btnReset" changeevent="engine-state-change" label="Выход">
        <ui-icon name="reset" slot="icon"></ui-icon>
    </ui-button>
</ui-toolbar>

<ui-overlay id="startOverlay" delay="100" changeevent="engine-state-change">
    <h1 class="pause-title">...BREATHE&nbsp;&nbsp;<br/>&nbsp;&nbsp;RHYTHM...</h1>
    <ui-button id="btnInitStart" class="btn-play-large" changeevent="engine-state-change" label="Начать">
        <ui-icon name="play" slot="icon"></ui-icon>
    </ui-button>
    <div class="key-hints">
        <span><kbd>SPACE</kbd> старт /пауза</span>
        <span><kbd>R</kbd> выход</span>
    </div>
</ui-overlay>
</body>
</html>
