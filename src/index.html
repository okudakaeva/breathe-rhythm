    <link rel="stylesheet" href="style.css">

          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230b0b0b'/%3E%3Crect x='3' y='3' width='94' height='94' rx='13' fill='none' stroke='%2300ffcc' stroke-width='4'/%3E%3Ctext x='-6' y='38' font-size='44'%3E✨%3C/text%3E%3Ctext x='14' y='74' font-size='62'%3E🎙️%3C/text%3E%3Ctext x='4' y='92' font-size='62'%3E🌊%3C/text%3E%3Ctext x='56' y='46' font-size='44'%3E✨%3C/text%3E%3C/svg%3E"/>
    <meta name="description"
          content="Нативный декларативный графический движок для визуализации поэтических перформансов в реальном времени.">
    <meta name="keywords" content="поэзия, инсталляция, цифровой арт, canvas, web components, typescript">
    <meta name="author" content="Оксана Кудакаева">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://okudakaeva.github.io/breathe-rhythm/">
    <meta property="og:title" content="В ритме дыхания — 🎙️🌊✨Breathe Rhythm — Поэтическая инсталляция">
    <meta property="og:description"
          content="Слова сгорают как холсты... Интерактивный Canvas-движок визуализации живой поэзии 🎙️🌊✨Breathe Rhythm">
    <meta property="og:image" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.png">
    <meta property="og:image:secure_url" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.png"/>
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Breathe Rhythm">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://okudakaeva.github.io/breathe-rhythm/">
    <meta name="twitter:title" content="В ритме дыхания — 🎙️🌊✨Breathe Rhythm — Поэтическая инсталляция">
    <meta name="twitter:description"
          content="Слова сгорают как холсты... Интерактивный Canvas-движок визуализации живой поэзии 🎙️🌊✨Breathe Rhythm">
    <meta name="twitter:image" content="https://okudakaeva.github.io/breathe-rhythm/images/og-preview.png">
    <meta name="theme-color" content="#0b0b0b">
    <script src="./breathe_rhythm_engine.js" type="module"></script>
    <script src="./ui/index.js" type="module"></script>
</head>
<body>
<ui-app>
    <breathe-rhythm data-id="ID_ENGINE" visible></breathe-rhythm>

    <ui-overlay data-id="ID_PAUSE_OVERLAY" delay="350" hidden>
        <h2 class="screen-title" data-dict="PAUSE_TITLE"></h2>
        <p class="screen-subtitle" data-dict="APP_SUBTITLE"></p>
        <ui-button data-id="ID_BTN_RESUME" class="btn-play-large" data-dict="BTN_RESUME">
            <ui-icon name="play" slot="icon"></ui-icon>
        </ui-button>
    </ui-overlay>

    <ui-toolbar data-id="ID_TOOLBAR" hidden>
        <ui-button data-id="ID_BTN_START" data-dict="BTN_START">
            <ui-icon name="play" slot="icon"></ui-icon>
        </ui-button>
        <ui-button data-id="ID_BTN_RESET" data-dict="BTN_RESET">
            <ui-icon name="reset" slot="icon"></ui-icon>
        </ui-button>
    </ui-toolbar>

    <ui-overlay data-id="ID_START_OVERLAY" delay="0">
        <ui-logo data-dict="APP_TITLE"></ui-logo>
        <ui-subtitle data-dict="APP_SUBTITLE"></ui-subtitle>
        <ui-button data-id="ID_BTN_INTRO" class="btn-play-large" data-dict="BTN_START">
            <ui-icon name="play" slot="icon"></ui-icon>
        </ui-button>
        <div class="key-hints">
            <span><kbd data-dict="HINT_SPACE_KEY"></kbd> <span data-dict="HINT_SPACE_DESC"></span></span>
            <span><kbd data-dict="HINT_RESET_KEY"></kbd> <span data-dict="HINT_RESET_DESC"></span></span>
        </div>
    </ui-overlay>
</ui-app>
</body>
</html>
